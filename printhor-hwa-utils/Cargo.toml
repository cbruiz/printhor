[package]
name = "printhor-hwa-utils"
version = "0.0.4"
edition = "2024"
authors = ["Carlos Barrales Ruiz <cbruiz@gmail.com>"]
description = "Printhor hardware abstraction utilities"
readme = "README.md"
repository = "https://github.com/cbruiz/printhor"
keywords = ["hardware", "abstraction", "library", "printhor"]
categories = ["hardware-support"]
license.workspace = true
documentation = "https://docs.rs/printhor-hwa-utils"

[lib]

[features]
default = ["std", "with-log"]
std = ["printhor-hwa-common-macros/std", "critical-section/std", "futures-test/std", "with-log"]
with-log = ["log"]
with-defmt = ["defmt"]

[dependencies]
printhor-hwa-common-macros = { version = "0.0.4", default-features = false, path = "../printhor-hwa-common-macros" }
portable-atomic = { version = "1.15.0",  default-features = false, features = ["critical-section"] }
static_cell = { version = "2.1.1",  default-features = false, features = [] }
embassy-sync = { version = "0.8.0", features = [] }
cfg-if = { version = "1.0.0" }
defmt = { version = "1.2.0", optional = true, default-features = false, features = [] }
log = { version = "0.4.35", default-features = false, optional = true }
critical-section = { version = "1.2.0", default-features = false, features = []}

[dev-dependencies]
futures-test = { version = "0.3.34", default-features = false }

[lints]
workspace = true
